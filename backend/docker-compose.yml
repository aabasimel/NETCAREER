  #     interval: 2s
  #     retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: netcareer
    restart: always
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    command: bash -c "chmod +x /app/migrate.sh && /app/migrate.sh && chmod +x /app/entrypoint.sh && /app/entrypoint.sh"
    depends_on:
      # - db
      - redis
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://red-d4jhfnadbo4c7385bcng:6379

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker1
    command: bash -c "chmod +x /app/migrate-celery.sh && /app/migrate-celery.sh && /opt/venv/bin/celery -A config worker --loglevel=info"

    depends_on:
      - web
      - redis
    environment:
        - DEBUG=1
        - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]
        - CELERY_BROKER=redis://red-d4jhfnadbo4c7385bcng:6379
        - CELERY_BACKEND=redis://red-d4jhfnadbo4c7385bcng:6379   
    volumes:
      - .:/app

volumes:
  redis_data:
